name: Composite CI

on:
  pull_request:
    paths:
      - "07-composite/**"
      - ".github/workflows/composite-ci.yml"
  push:
    branches: [main]
    paths:
      - "07-composite/**"
      - ".github/workflows/composite-ci.yml"

defaults:
  run:
    working-directory: 07-composite

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      AUTH_SECRET: ci-only-secret-not-used-in-any-real-environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 07-composite/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run migration-guard
      - run: npm run test:unit
      - run: npm run seed
      - run: npm run test:domain
