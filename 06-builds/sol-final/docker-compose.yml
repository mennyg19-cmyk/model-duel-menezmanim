services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: menez
      POSTGRES_USER: menez
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menez-local}
    ports:
      - "8102:5432"
    volumes:
      - menez-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menez -d menez"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://menez:${POSTGRES_PASSWORD:-menez-local}@db:5432/menez?schema=public
      AUTH_MODE: self-hosted
      SESSION_SECRET: ${SESSION_SECRET:-replace-this-session-secret}
      SYNC_DEVICE_SECRET: ${SYNC_DEVICE_SECRET:-replace-this-device-secret}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-admin@menezmanim.local}
      HOSTNAME: 0.0.0.0
      PORT: 3102
    ports:
      - "3102:3102"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  menez-postgres:
